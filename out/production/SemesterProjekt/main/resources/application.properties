spring.application.name=data-server

# Server port (HTTP - ikke kritisk for gRPC, men god at have)
server.port=8081

# gRPC Server
grpc.server.port=9090

# Supabase Database Connection (AWS Pooler - KORREKT!)
spring.datasource.url=jdbc:postgresql://aws-1-eu-north-1.pooler.supabase.com:6543/postgres
spring.datasource.username=postgres.dvpvcxcthtdglukskvdc
spring.datasource.password=Seshej1991
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (vigtigt for cloud database)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SSL for Supabase (vigtigt!)
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# Logging
logging.level.com.semesterprojekt=DEBUG
logging.level.io.grpc=INFO
logging.level.com.zaxxer.hikari=DEBUG
