spring.application.name=data-server

# Server port (HTTP)
server.port=8081

# gRPC Server
grpc.server.port=9090

# Database - NY KONFIGURATION
spring.datasource.url=jdbc:postgresql://localhost:5432/semester_projekt
spring.datasource.username=sp_user
spring.datasource.password=spPassword123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.semesterprojekt=DEBUG
logging.level.io.grpc=INFO
