syntax = "proto3";
package quiz;

option java_package = "com.semesterprojekt.proto.quiz";
option java_multiple_files = true;
option csharp_namespace = "SemesterProjekt.Proto.Quiz";

service QuizService {
    rpc CreateQuiz (CreateQuizRequest) returns (CreateQuizResponse);
    rpc DeleteQuiz (DeleteQuizRequest) returns (DeleteQuizResponse);
    rpc GetUserQuizzes (GetUserQuizzesRequest) returns (GetUserQuizzesResponse);
    rpc GetAvailableQuizzes (GetAvailableQuizzesRequest) returns (GetAvailableQuizzesResponse);
    rpc GetQuiz (GetQuizRequest) returns (GetQuizResponse);
    rpc SubmitQuiz (SubmitQuizRequest) returns (SubmitQuizResponse);

    // Attempt-related RPCs
    rpc GetUserAttempts (GetUserAttemptsRequest) returns (GetUserAttemptsResponse);
    rpc GetQuizAttempts (GetQuizAttemptsRequest) returns (GetQuizAttemptsResponse);
    rpc GetUserStats (GetUserStatsRequest) returns (GetUserStatsResponse);
    rpc GetLeaderboard (GetLeaderboardRequest) returns (GetLeaderboardResponse);
}

// Create Quiz Messages
message CreateQuizRequest {
    string created_by = 1;
    string title = 2;
    repeated CreateQuizQuestion questions = 3;
}

message CreateQuizQuestion {
    string question_text = 1;
    int32 question_order = 2;
    int32 points = 3;
    repeated CreateQuestionOption options = 4;
}

message CreateQuestionOption {
    string option_text = 1;
    bool is_correct = 2;
    int32 option_order = 3;
}

message CreateQuizResponse {
    bool success = 1;
    string quiz_id = 2;
    string title = 3;
    int32 question_count = 4;
    int32 total_points = 5;
    string error_message = 6;
}

// Delete Quiz Messages
message DeleteQuizRequest {
    string user_id = 1;
    string quiz_id = 2;
}

message DeleteQuizResponse {
    bool success = 1;
    string message = 2;
}

// Get User Quizzes Messages
message GetUserQuizzesRequest {
    string user_id = 1;
}

message GetUserQuizzesResponse {
    repeated QuizSummary quizzes = 1;
}

// Get Available Quizzes Messages (quizzes NOT created by user)
message GetAvailableQuizzesRequest {
    string user_id = 1;
}

message GetAvailableQuizzesResponse {
    repeated QuizSummary quizzes = 1;
}

message QuizSummary {
    string quiz_id = 1;
    string title = 2;
    int32 question_count = 3;
    int32 total_points = 4;
    string created_at = 5;
}

// Get Quiz Messages (for playing quiz)
message GetQuizRequest {
    string quiz_id = 1;
    string user_id = 2;
}

message GetQuizResponse {
    bool found = 1;
    string quiz_id = 2;
    string title = 3;
    string created_by = 4;
    string created_at = 5;
    int32 total_points = 6;
    repeated QuizQuestion questions = 7;
}

message QuizQuestion {
    string question_id = 1;
    string question_text = 2;
    int32 question_order = 3;
    int32 points = 4;
    repeated QuestionOption options = 5;
}

message QuestionOption {
    string option_id = 1;
    string option_text = 2;
    int32 option_order = 3;
    bool is_correct = 4;
}

// Submit Quiz Messages
message SubmitQuizRequest {
    string quiz_id = 1;
    string user_id = 2;
    repeated QuizAnswer answers = 3;
    int32 duration_seconds = 4;  // Added: time spent on quiz
}

message QuizAnswer {
    string question_id = 1;
    string selected_option_id = 2;
}

message SubmitQuizResponse {
    bool success = 1;
    int32 score = 2;
    int32 total_points = 3;
    repeated AnswerResult results = 4;
    string attempt_id = 5;           // Added: ID of saved attempt
    bool is_new_best = 6;            // Added: true if this is a new best score
    int32 previous_best_score = 7;   // Added: previous best score (0 if first attempt)
}

message AnswerResult {
    string question_id = 1;
    bool is_correct = 2;
    int32 points_earned = 3;
}

// =====================================================
// Attempt-related Messages
// =====================================================

// Get all attempts for a user
message GetUserAttemptsRequest {
    string user_id = 1;
    int32 limit = 2;  // Optional: limit number of results (default 20)
}

message GetUserAttemptsResponse {
    repeated AttemptSummary attempts = 1;
}

message AttemptSummary {
    string attempt_id = 1;
    string quiz_id = 2;
    string quiz_title = 3;
    int32 score = 4;
    int32 total_points = 5;
    int32 correct_count = 6;
    int32 total_count = 7;
    int32 duration_seconds = 8;
    string completed_at = 9;
    bool is_best_attempt = 10;
    double percentage = 11;
}

// Get attempts for a specific quiz by a user
message GetQuizAttemptsRequest {
    string user_id = 1;
    string quiz_id = 2;
}

message GetQuizAttemptsResponse {
    repeated AttemptSummary attempts = 1;
    AttemptSummary best_attempt = 2;  // The best attempt (if exists)
    int32 attempt_count = 3;
}

// Get user statistics
message GetUserStatsRequest {
    string user_id = 1;
}

message GetUserStatsResponse {
    int32 total_score = 1;           // Sum of best scores across all quizzes
    int32 quizzes_taken = 2;         // Number of unique quizzes attempted
    int32 total_attempts = 3;        // Total number of attempts
    int32 quizzes_created = 4;       // Number of quizzes created by user
    double average_percentage = 5;   // Average score percentage across best attempts
    repeated AttemptSummary recent_attempts = 6;  // Last 5 attempts
}

// Get leaderboard
message GetLeaderboardRequest {
    int32 limit = 1;  // Optional: limit number of results (default 50)
}

message GetLeaderboardResponse {
    repeated LeaderboardEntry entries = 1;
}

message LeaderboardEntry {
    string user_id = 1;
    string first_name = 2;
    string last_name = 3;
    int32 semester = 4;
    int32 total_score = 5;
    int32 quizzes_taken = 6;
    int32 rank = 7;
}
